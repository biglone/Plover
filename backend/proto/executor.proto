syntax = "proto3";

package plover.executor.v1;

service Executor {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Observe(ObserveRequest) returns (ObserveResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream ExecutionEvent);
}

message ExecuteRequest {
  string run_id = 1;
  string step_id = 2;
  repeated Action actions = 3;
}

message ExecuteResponse {
  bool ok = 1;
  string summary = 2;
  string failure_type = 3;
  bytes screenshot_png = 4;
}

message ObserveRequest {
  string run_id = 1;
}

message ObserveResponse {
  bool ok = 1;
  bytes screenshot_png = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message WatchEventsRequest {
  string run_id = 1;
}

message ExecutionEvent {
  string run_id = 1;
  string step_id = 2;
  string kind = 3;
  string ui_summary = 4;
  string detail = 5;
  string created_at = 6;
}

message Action {
  oneof operation {
    PointerAction pointer = 1;
    KeyboardAction keyboard = 2;
    ScrollAction scroll = 3;
    WaitAction wait = 4;
    ObserveAction observe = 5;
  }
}

message PointerAction {
  enum Kind {
    CLICK = 0;
    DOUBLE_CLICK = 1;
    MOVE = 2;
    DRAG = 3;
  }
  Kind kind = 1;
  int32 x = 2;
  int32 y = 3;
  int32 end_x = 4;
  int32 end_y = 5;
}

message KeyboardAction {
  string text = 1;
  repeated string keys = 2;
}

message ScrollAction {
  int32 delta = 1;
}

message WaitAction {
  uint32 milliseconds = 1;
}

message ObserveAction {}

